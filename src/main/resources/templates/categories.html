<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories</title>
  <link rel="stylesheet" href="../static/css/categories-style.css" th:href="@{/css/categories-style.css}" />
</head>

<body>
<div class="container">
  <div class="page-header">
    <h2 class="main-header">All Categories</h2>
    <a th:href="@{/home}" class="button button-secondary">Home</a>
  </div>

  <div class="categories-list">

    <div class="category-row" th:each="item : ${categories}">
      <div class="category-info">
        <span class="category-title" th:text="${item.name}">Name</span>
        <span class="category-spent" th:text="${#numbers.formatDecimal(item.spent, 1, 2)} + ' ₴'">Spent</span>
      </div>

      <div class="btn-wrapper">
        <a href="/view-category-expenses" th:href="@{/view-category-expenses(categoryId=${item.id})}" class="button">
          View Expenses
        </a>
      </div>
    </div>

  </div>

  <div class="pagination-container" th:if="${categoryPage != null and categoryPage.totalPages > 1}">
    <ul class="pagination">
      <li th:class="${categoryPage.hasPrevious()} ? '' : 'disabled'">
        <a th:href="@{/categories(page=${categoryPage.number - 1}, size=${categoryPage.size})}">&laquo; Previous</a>
      </li>

      <li th:each="pageIdx : ${#numbers.sequence(0, categoryPage.totalPages - 1)}"
          th:class="${pageIdx == categoryPage.number} ? 'active' : ''">
        <a th:href="@{/categories(page=${pageIdx}, size=${categoryPage.size})}" th:text="${pageIdx + 1}">1</a>
      </li>

      <li th:class="${categoryPage.hasNext()} ? '' : 'disabled'">
        <a th:href="@{/categories(page=${categoryPage.number + 1}, size=${categoryPage.size})}">Next &raquo;</a>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
