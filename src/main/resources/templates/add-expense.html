<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Expense</title>
  <link rel="stylesheet" href="../static/css/add-expense.css" th:href="@{/css/add-expense.css}" />
</head>
<body>
<div class="container">
  <h2 class="form-title">Add Expense</h2>

  <form method="post" th:action="@{/add-expense}" th:object="${expense}" class="add-expense-form">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" th:field="*{title}" placeholder="e.g., Grocery Shopping" class="input-field" required />
    </div>

    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" step="0.01" min="0.01" th:field="*{amount}" placeholder="0.00" class="input-field" required />
      <div th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" class="error-message" style="color: red;"></div>
    </div>


    <div class="form-group">
      <label for="category">Category</label>
      <input type="text" id="category" th:field="*{category}" placeholder="e.g., Food" class="input-field" required />
    </div>

    <button type="submit" class="btn-submit">Add Expense</button>
  </form>
</div>
</body>
</html>
