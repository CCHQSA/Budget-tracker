<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense</title>
  <link rel="stylesheet" href="../static/css/add-expense.css" th:href="@{/css/add-expense.css}" />
</head>
<body>
<main class="container">
  <div class="page-header">
    <h1 class="form-title">Add Expense</h1>
    <a th:href="@{/expenses}" class="link-button">Back to Expenses</a>
  </div>

  <form method="post" th:action="@{/add-expense}" th:object="${expense}" class="add-expense-form">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" th:field="*{title}" placeholder="Grocery Shopping" class="input-field" required>
    </div>

    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" step="0.01" min="0.01" th:field="*{amount}" placeholder="0.00" class="input-field" required>
      <div th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" class="error-message"></div>
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <input type="text" id="category" th:field="*{category}" placeholder="Food" class="input-field" th:list="categories-list" required>
      <datalist id="categories-list" th:each="category : ${categories}">
        <option th:value="${category.name}"></option>
      </datalist>
    </div>

    <button type="submit" class="btn-submit">Add Expense</button>
  </form>
</main>
</body>
</html>
