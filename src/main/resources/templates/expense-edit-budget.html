<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Expense</title>
  <link rel="stylesheet" href="/css/edit-expense.css" />
</head>
<body>

<div class="form-container">
  <h2>Edit Expense</h2>

  <form th:action="@{/expenses/budget/edit/{id}(id=${expense.id})}" th:object="${expense}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" th:field="*{title}" placeholder="Enter title" required />
    </div>

    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" step="0.01" id="amount" th:field="*{amount}" placeholder="0.00" required />
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" th:field="*{date}" required />
    </div>

    <button type="submit" class="btn-submit">Update Expense</button>
    <a href="/expenses-budget" class="cancel-link">Cancel</a>
  </form>
</div>

</body>
</html>
