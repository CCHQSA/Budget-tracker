<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Budget</title>
  <link rel="stylesheet" th:href="@{/css/create-budget.css}" href="../static/css/create-budget.css">
</head>
<body>

<form th:action="@{/budget/create}" method="post">

  <div class="description">
    <h1 class="main-header">Create Budget</h1>
    <p th:if="${error != null}" th:text="${error}" style="color: #b00020;"></p>
  </div>

  <div class="reasons">
    <label for="month" class="field-label">Select Month:</label>
    <input
            type="month"
            id="month"
            name="month"
            th:value="${currentMonth != null ? currentMonth : #temporals.format(#temporals.createNow(), 'yyyy-MM')}"
            required
    >
  </div>

  <div class="reasons">
    <label for="amount" class="field-label">Monthly Budget Limit (₴):</label>
    <input type="number" id="amount" name="amount" placeholder="2500" step="0.01" min="0" required>
  </div>

  <div class="redirect">
    <div class="button-group">
      <a th:href="@{/}" class="button button-secondary">Cancel</a>
      <button type="submit" class="button button-submit">Create Budget</button>
    </div>
  </div>

</form>

</body>
</html>
