<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Budget</title>
  <link rel="stylesheet" th:href="@{/css/create-budget.css}" href="../static/css/create-budget.css">
</head>
<body>
<main class="container">
  <div class="page-header">
    <h1 class="main-header">Create Budget</h1>
    <a th:href="@{/home}" class="button button-secondary">Back to Home</a>
  </div>

  <form th:action="@{/budget/create}" method="post" class="budget-form">
    <p th:if="${error != null}" th:text="${error}" class="error-message"></p>

    <div class="form-group">
      <label for="month" class="field-label">Month</label>
      <input
              type="month"
              id="month"
              name="month"
              th:value="${currentMonth != null ? currentMonth : #temporals.format(#temporals.createNow(), 'yyyy-MM')}"
              required
      >
    </div>

    <div class="form-group">
      <label for="amount" class="field-label">Monthly Budget Limit (UAH)</label>
      <input type="number" id="amount" name="amount" placeholder="2500" step="0.01" min="0" required>
    </div>

    <button type="submit" class="button button-submit">Create Budget</button>
  </form>
</main>
</body>
</html>
