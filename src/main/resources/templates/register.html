<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" th:href="@{/css/register.css}" href="../static/css/register.css">
</head>
<body>
<div class="login-container">
  <h1 class="login-title">Register</h1>
  <form method="post" th:action="@{/register}" th:object="${user}" class="login-form">
    <input type="text" th:field="*{username}" placeholder="Username" required />
    <input type="email" th:field="*{email}" placeholder="Email" required />
    <input type="password" th:field="*{password}" placeholder="Password" required />
    <button type="submit" class="btn-submit">Register</button>
  </form>
  <div class="redirect-link">
    <a th:href="@{/login}" href="login.html">Already have an account? Login</a>
  </div>
</div>
</body>
</html>
